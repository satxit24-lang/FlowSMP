name: Build FlowSMP
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q FlowSMP-Paper-source.zip -d proj
      - run: mvn -B -f proj/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: FlowSMP-jar
          path: proj/target/FlowSMP-*.jar
